name: trade-alerts

on:
  schedule:
    - cron: "2,32 * * * *"      # 2 minutes after every 30m candle close (UTC)
  workflow_dispatch:             # lets you run it manually from the Actions tab

permissions:
  contents: write                # needed to save signals_log.csv back to the repo

concurrency:
  group: trade-alerts
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-alerts.txt

      - run: pip install -r requirements-alerts.txt

      - name: Restore higher-timeframe data cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: htf-${{ github.run_id }}
          restore-keys: htf-

      - name: Scan markets and send alerts
        env:
          TWELVE_KEY: ${{ secrets.TWELVE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alert_job.py

      - name: Save signal log
        run: |
          git config user.name "alert-bot"
          git config user.email "alert-bot@users.noreply.github.com"
          git add signals_log.csv 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "log signals" && git pull --rebase && git push)
